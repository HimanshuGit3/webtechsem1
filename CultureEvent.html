<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presidency University — Cultural Event Registration</title>
  <style>

    /* Center the main form container */
    .main {
      width: 60%;
      margin: 40px auto;
      background-color: rgb(47, 255, 217);
      border-radius: 10px;
      box-shadow: 0px 0px 15px rgba(65, 238, 209, 0.285);
      padding: 30px 40px;
      
    }

    h1, h2 {
      text-align: center;
      color: #4B0082;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    .checkbox-group {
      margin-top: 10px;
    }

    .checkbox-group input {
      margin-right: 6px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4B0082;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background-color: #5e00b3;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #555;
    }

    .note {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    
    
  </style>
</head>
<body bgcolor="skyblue">
  <marquee><h1>Presidency University</h1></marquee>
  <img src="C:\Users\Himanshu\Desktop\pun.jpeg" align="right" width="200" height="180">
  

  <div class="main">
    <h2>Fill this registration form to participate in the Cultural Fest</h2>
    
    <form action="info.txt" method="post">
      <label for="fullname">Full name *</label>
      <input id="fullname" name="fullname" type="text" placeholder="e.g. Himanshu Kumar Singh" required>

      <label for="studentid">Student ID No.</label>
      <input id="studentid" name="studentid" type="text" placeholder="e.g. PU2025XXXX" required>

      <label for="email">Email *</label>
      <input id="email" name="email" type="email" placeholder="name@presidency.edu" required>

      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" placeholder="+91 98XXXXXXXX" required><br>
      <br>
      <fieldset>

      <label for="Dob">DOB *</label>
      <input id="Dob" name="DOB" type="date"  required><br>
      <br>

      Gender: 
      Male<input type="radio" name="gender">
      Female<input type="radio" name="gender">

      </fieldset>

      <label for="department">Department *</label>
      <select id="department" name="department" required>
        <option value="">-- select department --</option>
        <option>School Of Information Science</option>
        <option>School Of Computer Science</option>
        <option>School of Arts & Humanities</option>
        <option>School of Science</option>
        <option>School of Law</option>
        <option>School of Design</option>
        <option>Others</option>
      </select>

      <label for="year">Year / Programme *</label>
      <select id="year" name="year" required>
        <option value="">-- select --</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
        <option>Postgraduate</option>
        <option>Ph.D.</option>
      </select>

      <b>Select the program you want to participate in:</b>
      <div class="checkbox-group">
        <label><input type="checkbox"> Solo Dance (Break Dance, Classical, Kathak, Traditional)</label>
        <label><input type="checkbox"> Group Dance (At least 8 members required)</label>
        <label><input type="checkbox"> Solo Singing (Instruments provided if needed)</label>
        <label><input type="checkbox"> Group Singing (At least 5 members required)</label>
        <label><input type="checkbox"> Open Mic (Freestyle)</label>
        <label><input type="checkbox"> Fashion Show (At least 10 members required)</label>
      </div>


      <label for="role">Role (if any)</label>
      <input id="role" name="role" type="text" placeholder="Performer / Volunteer">

      <label for="notes">Additional details</label>
      <textarea id="notes" name="notes" placeholder="Any special requirements, instruments needed, number of team members..."></textarea>

      <label for="emergency">Emergency contact</label>
      <input id="emergency" name="emergency" type="tel" placeholder="Name — phone">

      <label for="consent">
        <input id="consent" name="consent" type="checkbox" required>
        I confirm that the information given is correct and I agree to follow event guidelines.
      </label>

      <button type="submit">Register</button>
      <button type="reset">Reset</button>

      <p class="note">Registration closes: <strong>Oct 25, 2025</strong></p>
    </form>
  </div>

  <footer>
    Presidency University — Cultural Committee © 2025 | For queries: 
    <a href="mailto:himanshu@presidency.edu">Himanshu@presidency.edu</a>
  </footer>
</body>
</html>
