<!DOCTYPE html>
<html>
<head>
    <title>CSS Stylesheet Demo</title>

    <!-- 🔹 External CSS -->
    <link rel="stylesheet" href="extermal.css">

    <!-- 🔹 Internal CSS -->
    <style>
        h2 {
            color: purple;
            text-align: center;
        }

        .internal {
            font-size: 18px;
            color: blue;
        }
    </style>
</head>

<body bgcolor="pink">

    <!-- 🔹 Inline CSS -->
    <h1 style="color: blue; text-align: center;">
        Welcome to my website
    </h1>

    <p style="color: green; font-size: 18px;">
        This paragraph is styled using inline CSS.
    </p>

    <!-- 🔹 External CSS -->
    <h2>External CSS Example</h2>
    <p class="external">
        This paragraph is styled using external CSS.
    </p>

    <!-- 🔹 Internal CSS -->
    <h2>Internal CSS Example</h2>
    <p class="internal">
        This paragraph is styled using internal CSS.
    </p>

    <!-- 🔹 Inline CSS -->
    <button style="background-color: red; color: white; border: none; padding: 10px 20px;">
        Click Me
    </button>

</body>
</html>
