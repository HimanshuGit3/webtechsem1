<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Shopping Catalog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .catalog {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 200px;
      text-align: center;
      padding: 10px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
    }
    .item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    .item h3 {
      margin: 10px 0 5px;
      color: #444;
    }
    .price {
      color: green;
      font-weight: bold;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Online Shopping Catalog</h1>
  <div class="catalog">
    <div class="item">
      <img src="ppu.jpeg" alt="Headphones">
      <h3>Wireless Headphones</h3>
      <p class="price">$49.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="item">
      <img src="https://picsum.photos/200/150?2" alt="Watch">
      <h3>Smart Watch</h3>
      <p class="price">$79.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="item">
      <img src="https://picsum.photos/200/150?3" alt="Shoes">
      <h3>Running Shoes</h3>
      <p class="price">$59.99</p>
      <button>Add to Cart</button>
    </div>
  </div>
</body>
</html>
